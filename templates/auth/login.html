<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - UniVerse</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/sound.js') }}"></script>
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card animate-pop">
            <div class="auth-logo">
                <h1>UNIVERSE</h1>
                <p>Welcome back!</p>
            </div>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <form method="post" class="auth-form">
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" onclick="playSound()">Log In</button>
            </form>
            <div class="auth-footer">
                <p>New to UniVerse? <a href="{{ url_for('register') }}">Sign up</a> · <a href="{{ url_for('index') }}">Home</a></p>
            </div>
        </div>
    </div>
</body>
</html>
